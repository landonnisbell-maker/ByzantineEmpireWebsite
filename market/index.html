<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0a0b0d"><title>ta pánta pazári · Market</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0c0d0f;color:#fff;font-family:Arial,sans-serif}
#byz-gallery,#byz-palia{position:fixed;inset:0;display:block;width:100%;height:100%;height:100dvh;border:0;overflow:hidden;}
#byz-gallery{z-index:1;background:#111;opacity:1;transition:opacity .65s cubic-bezier(.22,1,.36,1);}
/* Palia has its real viewport while warming up, unlike a display:none iframe. */
#byz-palia{z-index:2;background:#10141f;opacity:0.001;pointer-events:none;transform:scale(1.035) translateZ(0);filter:blur(9px);will-change:opacity,transform,filter;transition:opacity .76s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1),filter .76s ease;}
body.byz-product-open #byz-palia{opacity:1;transform:scale(1) translateZ(0);filter:blur(0);pointer-events:auto;}
body.byz-product-open #byz-gallery{opacity:0;pointer-events:none;}
body.byz-product-leaving #byz-palia{opacity:.001;transform:scale(1.025) translateZ(0);filter:blur(7px);pointer-events:none;transition:opacity .65s cubic-bezier(.42,0,.58,1),transform .65s ease,filter .65s ease;}
body.byz-product-leaving #byz-gallery{opacity:1;pointer-events:auto;}
/* A small non-modal indicator on the gallery, only if unusually slow preloading. */
#byz-status{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);z-index:4;color:#e7e7e7;pointer-events:none;opacity:0;transition:opacity .22s ease,transform .22s ease;font:600 10px/1.5 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;background:#17191ddd;border:1px solid #ffffff34;border-radius:4px;padding:11px 16px;backdrop-filter:blur(12px)}
#byz-status.visible{opacity:1;transform:translateX(-50%) translateY(0)}
#byz-retry{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:5;border:1px solid #a5abb3;background:#161921;color:white;padding:12px 16px;cursor:pointer;font:600 11px system-ui,sans-serif}
#byz-retry.visible{display:block}
@media(prefers-reduced-motion:reduce){#byz-palia,#byz-gallery{transition-duration:.2s!important}}

#byz-new-page-return{position:fixed;top:14px;left:15px;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 15px;background:rgba(9,11,15,.88);border:1px solid rgba(255,255,255,.25);color:#fff;font:600 10px/1.2 Arial,sans-serif;letter-spacing:.13em;cursor:pointer;transition:background .2s}
#byz-new-page-return:hover{background:rgba(40,44,52,.95)}
@media(max-width:600px){#byz-new-page-return{top:10px;left:10px;padding:11px 13px}}
</style>
</head><body>
<iframe id="byz-gallery" title="Interactive cloth product gallery" src="/ByzantineEmpireWebsite/market-runtime/gallery/index.html?byz-internal=1" allow="autoplay;fullscreen" loading="eager"></iframe>
<iframe id="byz-palia" title="Palia interactive product page" data-src="/ByzantineEmpireWebsite/market-runtime/palia/work/palia/?no-loader&byzantine-palia-preload=1&byzantine-lite-fullscreen=1" src="about:blank" allow="autoplay;fullscreen" loading="eager"></iframe>
<div id="byz-status" role="status" aria-live="polite">Preparing product experience…</div>
<button id="byz-retry" type="button">RETRY PRODUCT PAGE</button>
<button type="button" id="byz-new-page-return" aria-label="Return to Crystals">← RETURN TO CRYSTALS</button>
<script>
(()=>{
'use strict';
const gallery=document.getElementById('byz-gallery');
const palia=document.getElementById('byz-palia');
let paliaStartedLoading=false;
function ensurePaliaLoaded(){
 if(paliaStartedLoading)return;
 paliaStartedLoading=true;
 palia.src=palia.getAttribute('data-src');
}

const status=document.getElementById('byz-status');
const retry=document.getElementById('byz-retry');
// Separate dedicated product routes, backed by individual products/*.json files.
const PRODUCTS=Object.freeze([
  {slug:'paramerion-sword',title:'Paramerion Sword'},
  {slug:'gold-jewelry',title:'Gold Jewelry'},
  {slug:'food-items',title:'Food Items'},
  {slug:'coins',title:'Coins'},
  {slug:'silk-textiles',title:'Silk Textiles'}
]);
const PRODUCT_NAMES=Object.freeze(PRODUCTS.map(p=>p.title));
const PRODUCT_PATH_PREFIX='/ByzantineEmpireWebsite/market-runtime/products/';
const initialRoute=location.pathname.startsWith(PRODUCT_PATH_PREFIX)
  ? location.pathname.slice(PRODUCT_PATH_PREFIX.length).replace(/\/$/,'').replace(/\/index\.html$/,'') : null;
const initialIndex=PRODUCTS.findIndex(p=>p.slug===initialRoute);

const PRODUCT_SLUGS=Object.freeze({'cgtrader':0,'w3r-one':1,'presti':2,'grandir':3,'reaali':4});
let activeProductIndex=initialIndex>=0?initialIndex:0;
let enteredPalia=false, sceneStarted=false, visualReady=false, productRequested=false, leaving=false, failing=false;
let loadDeadline=null, startTime=performance.now(), lastReadyEvent='initial';
function report(action,detail=''){
  if(new URLSearchParams(location.search).has('byzdebug'))console.debug('[Market]',action,detail);
}
function selectProduct(selection){
  let index = null;
  if(selection && Number.isInteger(selection.index) && selection.index>=0 && selection.index<PRODUCT_NAMES.length){
    index=selection.index;
  }else if(selection && typeof selection.slug==='string' && Object.prototype.hasOwnProperty.call(PRODUCT_SLUGS,selection.slug)){
    index=PRODUCT_SLUGS[selection.slug];
  }
  if(index!==null)activeProductIndex=index;
  const chosen=PRODUCTS[activeProductIndex];
  // Each selected cloth has a dedicated URL and independent product definition.
  // Only one WebGL renderer stays alive: switching pages resets its presentation
  // and scroll state instead of reloading several heavyweight Nuxt runtimes.
  if(palia.contentWindow) palia.contentWindow.postMessage({type:'byz:palia:set-product',title:chosen.title,slug:chosen.slug,index:activeProductIndex},location.origin);
  report('product-title',chosen.slug+' '+chosen.title);
}
function showStatus(show){status.classList.toggle('visible',show);}
function makeVisible(){
  if(!productRequested||!visualReady||leaving)return;
  // Reset the actual Nuxt page's scroller before exposing the fullscreen frame.
  // This is separate from the gallery scroll and does not mutate the gallery.
  activateProductScroll();
  clearTimeout(loadDeadline);loadDeadline=null;
  failing=false;retry.classList.remove('visible');showStatus(false);
  document.body.classList.remove('byz-product-leaving');
  document.body.classList.add('byz-product-open');
  report('reveal','Palia ready, unified compositor fade');
}
function activateProductScroll(){
  const p=PRODUCTS[activeProductIndex];
  if(palia.contentWindow) palia.contentWindow.postMessage({type:'byz:palia:activate-product',title:p.title,slug:p.slug,resetScroll:true,index:activeProductIndex},location.origin);
}
function openProduct(selection,options={}){
  if(leaving)return;
  ensurePaliaLoaded();
  selectProduct(selection);
  productRequested=true;
  const product=PRODUCTS[activeProductIndex];
  // SPA route with its own URL: refresh, bookmarks and deep links work.
  if(!options.fromHistory && location.pathname!==PRODUCT_PATH_PREFIX+product.slug){
    history.pushState({byzProduct:product.slug},'',PRODUCT_PATH_PREFIX+product.slug+'/');
  }
  report('card-click',`product=${product.slug} ready=${visualReady}, entered=${enteredPalia}, event=${lastReadyEvent}`);
  if(visualReady){makeVisible();return;}
  // Keep the live gallery visible while the product renderer finishes.
  // No gray or blue interim screen is ever presented.
  showStatus(true);
  clearTimeout(loadDeadline);
  loadDeadline=setTimeout(()=>{
    if(!productRequested||visualReady)return;
    showStatus(false);retry.classList.add('visible');failing=true;
    report('startup-timeout','preload remains unready; gallery stays usable');
  },18000);
}
function exitProduct(options={}){
  if(!productRequested && !document.body.classList.contains('byz-product-open'))return;
  productRequested=false;clearTimeout(loadDeadline);loadDeadline=null;
  // /lite is the gallery route; the original gallery iframe is NEVER reloaded.
  if(!options.fromHistory && location.pathname.startsWith(PRODUCT_PATH_PREFIX)){
    history.replaceState({byzGallery:true},'','/ByzantineEmpireWebsite/market-runtime/index.html');
  }
  retry.classList.remove('visible');showStatus(false);
  if(!document.body.classList.contains('byz-product-open'))return;
  leaving=true;
  report('return','preserving live gallery iframe');
  document.body.classList.add('byz-product-leaving');
  document.body.classList.remove('byz-product-open');
  // Never reload either frame. The Palia renderer remains ready for next visit.
  setTimeout(()=>{document.body.classList.remove('byz-product-leaving');leaving=false;},720);

}
function preparePalia(){
  if(enteredPalia)return;
  enteredPalia=true;
  report('prepared','request original Nuxt project start while offscreen');
  palia.contentWindow.postMessage({type:'byz:palia:enter'},location.origin);
}
window.addEventListener('message',ev=>{
  if(ev.origin===location.origin && ev.source===window.parent){
    if(ev.data?.type==='byz:market:enter'){window.__BYZ_MARKET_SHOULD_ENTER__=true;gallery.contentWindow?.postMessage({type:'byz:market:enter'},location.origin);}
    if(ev.data?.type==='byz:market:close'){gallery.contentWindow?.postMessage({type:'byz:market:close'},location.origin);exitProduct({fromHistory:true});}
    return;
  }

  if(ev.origin!==location.origin || !ev.data || typeof ev.data!=='object')return;
  const type=ev.data.type;
  if(ev.source===gallery.contentWindow){
    if(type==='byz:open-product')openProduct(ev.data);
    return;
  }
  if(ev.source!==palia.contentWindow)return;
  if(type==='byz:palia:prepared')preparePalia();
  if(type==='byz:palia:started' && !sceneStarted){
    sceneStarted=true;lastReadyEvent='started';
    selectProduct({index:activeProductIndex});
    report('scene-started','wait for the entire page surface before revealing');
    // The original Nuxt page, fonts, and hero effects finish behind the gallery.
    Promise.resolve(palia.contentDocument?.fonts?.ready).catch(()=>{}).then(()=>{
      setTimeout(()=>{
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          visualReady=true;lastReadyEvent='visual-ready';
          selectProduct({index:activeProductIndex});
          report('visual-ready',Math.round(performance.now()-startTime)+'ms after host boot');
          makeVisible();
        }));
      },1100);
    });
  }
  if(type==='byz:palia:return')exitProduct();
  if(type==='byz:palia:window-loaded')report('window-loaded');
});
palia.addEventListener('load',()=>{
  report('palia-iframe-loaded');
  selectProduct({index:activeProductIndex});
  // Palia V17 starts automatically, but replay missed ready signals if the
  // child became ready before the host listener was registered.
  palia.contentWindow.postMessage({type:'byz:palia:ping'},location.origin);
  setTimeout(()=>{if(!sceneStarted)palia.contentWindow.postMessage({type:'byz:palia:ping'},location.origin)},1400);
});
gallery.addEventListener('load',()=>{report('gallery-iframe-loaded');gallery.contentWindow?.postMessage({type:'byz:market:enter'},location.origin);setTimeout(ensurePaliaLoaded,2500);});
retry.addEventListener('click',()=>{
  retry.classList.remove('visible');showStatus(true);
  // A retry is only needed if WebGL initialization truly stalled.
  // Never disturb the gallery or its Enter the Experience button.
  enteredPalia=false;sceneStarted=false;visualReady=false;
  palia.src='/ByzantineEmpireWebsite/market-runtime/palia/work/palia/?no-loader&byzantine-palia-preload=1&byzantine-lite-fullscreen=1&retry='+Date.now();
  report('retry');openProduct();
});
window.addEventListener('popstate',()=>{
  const slug=location.pathname.startsWith(PRODUCT_PATH_PREFIX) ? location.pathname.slice(PRODUCT_PATH_PREFIX.length).replace(/\/$/,'') : '';
  const index=PRODUCTS.findIndex(p=>p.slug===slug);
  if(index>=0)openProduct({index},{fromHistory:true});
  else exitProduct({fromHistory:true});
});
if(initialIndex>=0){
  productRequested=true;
  showStatus(true);
  report('deep-link',PRODUCTS[initialIndex].slug);
}
const returnBtn=document.getElementById('byz-new-page-return');
function returnToCrystals(){
 if(window.parent!==window){
   window.parent.postMessage({type:'byz:v24:exit-market'},location.origin);
 }else{
   location.href='/ByzantineEmpireWebsite/';
 }
}
returnBtn.addEventListener('click',returnToCrystals);
window.addEventListener('keydown',e=>{if(e.key==='Escape' && !document.body.classList.contains('byz-product-open'))returnToCrystals()});
window.__BYZ_MARKET_SHOULD_ENTER__=true;
report('host-loaded','V24: new dedicated Market page, five product routes');
})();
</script><script>window.parent!==window && window.parent.postMessage({type:'byz:market:shell-ready'},location.origin);</script></body></html>
