<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Returning to the Byzantine Bazaar</title><style>html,body{background:#070b12;color:#dff8ff;font:16px/1.6 Georgia,serif;min-height:100%;margin:0;display:grid;place-items:center}a{color:#9beeff}</style><script>
(function(){
  function detectBase(){
    var path=location.pathname||'/';
    if(path==='/ByzantineEmpireWebsite' || path.indexOf('/ByzantineEmpireWebsite/')===0) return '/ByzantineEmpireWebsite/';
    var parts=path.split('/').filter(Boolean);
    if(parts.length>=1 && !/\./.test(parts[0])) return '/' + parts[0] + '/';
    return '/';
  }
  var home=detectBase();
  try{ sessionStorage.setItem('byz-returned-from-404','1'); }catch(e){}
  if(location.pathname!==home){ location.replace(home + location.search + location.hash); }
})();
</script><noscript><meta http-equiv="refresh" content="0;url=/"></noscript></head><body><p>Returning to <a id="byz-home-link" href="/">ta pánta pazári</a>…</p><script>(function(){var path=location.pathname||'/';var parts=path.split('/').filter(Boolean);var home=(path==='/ByzantineEmpireWebsite'||path.indexOf('/ByzantineEmpireWebsite/')===0)?'/ByzantineEmpireWebsite/':(parts.length&&!/\./.test(parts[0])?'/'+parts[0]+'/':'/');var link=document.getElementById('byz-home-link');if(link)link.href=home;})();</script></body></html>
